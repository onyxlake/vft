<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VFT · 视觉文件发送</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">VISUAL FILE TRANSFER</p><h1>让画面传递文件</h1></div>
      <span class="badge">浏览器发送端</span></header>
    <p class="intro">选择文件，在接收端启动屏幕捕获，然后保持发送画面完整可见。文件在本机读取。</p>
    <section class="controls" aria-label="发送配置">
      <label class="file-label">选择文件<input id="file" type="file"></label>
      <label>画面模式<select id="profile"><option value="1">Balanced · 四级灰度</option>
        <option value="0">Robust · 黑白</option></select></label>
      <label>目标 FPS<input id="fps" type="number" min="1" max="60" value="15" required></label>
      <label>像素 / 单元<input id="cell" type="number" min="2" max="32" value="8" required></label>
      <div class="buttons"><button id="start" disabled>开始发送</button><button id="pause" disabled>暂停</button>
        <button id="stop" disabled>停止</button><button id="fullscreen" disabled>全屏画面</button></div>
    </section>
    <div class="status-row"><p id="status" role="status" aria-live="polite">等待选择文件</p>
      <span id="dimensions"></span></div>
    <section id="stage" aria-label="视觉传输画面"><p id="placeholder">发送画面将在这里显示</p>
      <canvas id="frame" hidden aria-label="VFT 协议帧"></canvas></section>
    <footer><p id="metrics">已显示 0 帧 · 显示 FPS 0.0</p>
      <p class="hint">空格暂停 / 继续 · F11 切换全屏 · Esc 退出全屏。切换到后台会自动暂停。</p>
      <p class="hint">发送会持续提供修复帧；接收端显示 SHA-256 验证完成后，可停止发送。</p>
      <details><summary>文件 SHA-256</summary><output id="digest">准备文件后显示</output></details></footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
